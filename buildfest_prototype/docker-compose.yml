version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fairness
    ports:
      - "5432:5432"
    volumes:
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  flask_api:
    build: ./app
    container_name: flask_api
    ports:
      - "5050:5050"   # host:container
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s

  fairness_job:
    build: ./fairness_job
    container_name: fairness_job
    depends_on:
      db:
        condition: service_healthy

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      db:
        condition: service_healthy

  # Optional: docker compose --profile integration up api_smoke  (needs app/model.pkl)
  api_smoke:
    profiles: ["integration"]
    image: python:3.10-slim
    environment:
      API_BASE: http://flask_api:5050
    volumes:
      - ./test_api.py:/test_api.py:ro
    depends_on:
      flask_api:
        condition: service_healthy
    command: ["python", "/test_api.py"]
